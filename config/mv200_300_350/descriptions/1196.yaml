packageId: 1196
descriptions:
  ru:
    summary: |-
      Выходной пакет КИВЛ. Информация о параметрах дыхания: измеренный объём вдоха и удельная работа аппарата за текущий вдох. Ошибок не содержит.
    details: |-
      Поля данных (длина 4 байта):
      • Байты 0–1 — измеренный объём вдоха [мл], усреднённый за 4 последних дыхательных цикла
      • Байты 2–3 — удельная работа аппарата в текущем вдохе [0,01 Дж/л]
  en:
    summary: |-
      Output packet from the CIVL. Breathing parameters: measured inspiratory volume and the device's specific work for the current breath. Contains no errors.
    details: |-
      Data fields (length 4 bytes):
      • bytes 0–1 — measured inspiratory volume [ml], averaged over the last 4 breath cycles
      • bytes 2–3 — device specific work for the current breath [0.01 J/l]
