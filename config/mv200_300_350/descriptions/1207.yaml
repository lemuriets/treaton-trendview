packageId: 1207
descriptions:
  ru:
    summary: |-
      Выходной пакет КИВЛ. Время наработки аппарата; формируется по запросу в ID_OPT_CIVL. Ошибок не содержит.
    details: |-
      Поля данных (длина 4 байта):
      • Байты 0–3 — время наработки аппарата с момента выпуска [мин]
  en:
    summary: |-
      Output packet from the CIVL. Device operating time; emitted on request via ID_OPT_CIVL. Contains no errors.
    details: |-
      Data fields (length 4 bytes):
      • bytes 0–3 — device operating time since manufacture [min]
