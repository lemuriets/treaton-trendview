packageId: 1204
descriptions:
  ru:
    summary: |-
      Выходной пакет КИВЛ. Параметры дыхания: статический комплайнс и резистанс. Ошибок не содержит.
    details: |-
      Поля данных (длина 4 байта):
      • Байты 0–1 — статический комплайнс [0,1 мл/см вод.ст.]
      • Байты 2–3 — резистанс [см H₂O·с/л]
      • 0xFFFF — недействительное значение
  en:
    summary: |-
      Output packet from the CIVL. Breathing parameters: static compliance and resistance. Contains no errors.
    details: |-
      Data fields (length 4 bytes):
      • bytes 0–1 — static compliance [0.1 ml/cmH₂O]
      • bytes 2–3 — resistance [cmH₂O·s/l]
      • 0xFFFF — invalid value
