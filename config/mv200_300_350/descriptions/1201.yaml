packageId: 1201
descriptions:
  ru:
    summary: |-
      Выходной пакет КИВЛ. Параметры дыхания: минутная вентиляция (общая и аппаратная). Ошибок не содержит.
    details: |-
      Поля данных (длина 4 байта):
      • Байты 0–1 — общая MV за минуту [мл/мин]
      • Байты 2–3 — аппаратная MV за минуту [мл/мин]
  en:
    summary: |-
      Output packet from the CIVL. Breathing parameters: minute ventilation (total and machine). Contains no errors.
    details: |-
      Data fields (length 4 bytes):
      • bytes 0–1 — total MV over the last minute [ml/min]
      • bytes 2–3 — machine MV over the last minute [ml/min]
