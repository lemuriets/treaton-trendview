packageId: 1221
descriptions:
  ru:
    summary: |-
      Выходной пакет ПП (CAPNO2). Измеренные параметры CO₂ по фазам дыхания и частота дыхания. 0xFF — недействительное значение.
    details: |-
      Поля данных (длина 5 байт):
      • Байт 0 — концентрация CO₂ в начале вдоха [0,1 %]
      • Байт 1 — парциальное давление CO₂ в начале вдоха [мм рт.ст.]
      • Байт 2 — концентрация CO₂ в конце выдоха [0,1 %]
      • Байт 3 — парциальное давление CO₂ в конце выдоха [мм рт.ст.]
      • Байт 4 — частота дыхания [1/мин] (0xFF — недействительно)
  en:
    summary: |-
      Output packet from the PP (CAPNO2). Measured CO₂ parameters by breath phase and respiratory rate. 0xFF — invalid value.
    details: |-
      Data fields (length 5 bytes):
      • byte 0 — CO₂ concentration at start of inhalation [0.1 %]
      • byte 1 — CO₂ partial pressure at start of inhalation [mmHg]
      • byte 2 — CO₂ concentration at end of exhalation [0.1 %]
      • byte 3 — CO₂ partial pressure at end of exhalation [mmHg]
      • byte 4 — respiratory rate [1/min] (0xFF — invalid)
