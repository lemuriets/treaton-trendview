packageId: 1199
descriptions:
  ru:
    summary: |-
      Выходной пакет КИВЛ. Параметры дыхания: измеренная частота дыхания. Ошибок не содержит.
    details: |-
      Поля данных (длина 2 байта):
      • Байт 0 — частота дыхания за последнюю минуту [вд/мин]
      • Байт 1 — частота самостоятельного дыхания [вд/мин]
  en:
    summary: |-
      Output packet from the CIVL. Breathing parameters: measured respiratory rate. Contains no errors.
    details: |-
      Data fields (length 2 bytes):
      • byte 0 — respiratory rate over the last minute [breaths/min]
      • byte 1 — spontaneous respiratory rate [breaths/min]
