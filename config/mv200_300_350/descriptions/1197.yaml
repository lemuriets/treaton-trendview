packageId: 1197
descriptions:
  ru:
    summary: |-
      Выходной пакет КИВЛ. Параметры дыхания: измеренный объём выдоха. Ошибок не содержит.
    details: |-
      Поля данных (длина 4 байта):
      • Байты 0–1 — объём выдоха [мл], усреднённый за 4 цикла
      • Байты 2–3 — объём выдоха без усреднения [мл]
  en:
    summary: |-
      Output packet from the CIVL. Breathing parameters: measured expiratory volume. Contains no errors.
    details: |-
      Data fields (length 4 bytes):
      • bytes 0–1 — expiratory volume [ml], averaged over 4 cycles
      • bytes 2–3 — expiratory volume without averaging [ml]
