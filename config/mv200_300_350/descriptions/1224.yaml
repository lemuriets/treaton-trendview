packageId: 1224
descriptions:
  ru:
    summary: |-
      Выходной пакет ПП (CAPNO2). Графическая информация VCO₂. Ошибок не содержит.
    details: |-
      Поля данных (длина 4 байта):
      • Байты 0–1 — волна VCO₂ [0,01 мл]
      • Байты 2–3 — интеграл VCO₂ [%]
  en:
    summary: |-
      Output packet from the PP (CAPNO2). VCO₂ graph data. Contains no errors.
    details: |-
      Data fields (length 4 bytes):
      • bytes 0–1 — VCO₂ wave [0.01 ml]
      • bytes 2–3 — VCO₂ integral [%]
