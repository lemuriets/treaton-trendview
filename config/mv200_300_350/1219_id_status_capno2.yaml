    1: { message: Датчик перегрет, status: Error }
    2: { message: Датчик дефектный, status: Error }
    3: { message: Не задано атмосферное давление, status: Warning }
    4: Капнограф в спящем режиме
    5: Активна коррекция нуля
    6: Активен прогрев датчика
    7: { message: Ошибка измерения нуля, status: Warning }
    8: { message: Высокое значение CO2, status: Warning }
    9: { message: Ошибка адаптера, status: Warning }
    10: { message: Высокое давление в линии отбора пробы, status: Warning }
- name: CapnographPresence
  kind: Value
  byte: 5
  description: Наличие капнографа
  values:
    0: { message: Капнограф подключен, status: Ok }
    20: { message: Капнограф не подключен, status: Warning }
- name: AtmosphericPressure
  kind: Value
  bytes:
  - 6
  - 7
  unit: мм рт.ст.
