    1: { message: Активна калибровка нуля, status: Info }
    2: { message: Необходимо провести калибровку нуля, status: Warning }
    3: { message: Ошибка калибровки нуля, status: Error }
- name: CurrentStabilizerStatus
  kind: BitRange
  byte: 1
  bitRange:
    from: 5
    to: 6
  gate: { byte: 5, value: 0 }
  values:
    0: { message: Ток в норме, status: Ok }
    1: { message: Ток стабилизируется, status: Info }
    2: { message: Ток не в норме, status: Error }
    3: { message: Ток ограничивается, status: Error }
- name: PriorityMessageNumber
